plugins {
    id 'base'
}

group = 'org.pwharned'
version = '1.0.0'
repositories {
    flatDir { dirs 'lib' }
    mavenCentral()

}


tasks.withType(AbstractArchiveTask).configureEach {
    archiveBaseName.set('epm-tool-assembly')
}

ext {
    sbtVersion         = '1.10.10'
    scalaBinaryVersion = '3.7.1'
}

def sbtDir    = file("$buildDir/sbt")
def sbtScript = "$sbtDir/bin/sbt"

tasks.register('installSbt', Exec) {
    description = 'Downloads and unpacks sbt locally'
    outputs.dir sbtDir

    onlyIf { !sbtDir.exists() }
    commandLine 'bash', '-c', """
      echo "Installing sbt ${sbtVersion}…"
      curl -sL "https://github.com/sbt/sbt/releases/download/v${sbtVersion}/sbt-${sbtVersion}.tgz" -o sbt.tgz
      mkdir -p ${sbtDir}
      tar xzf sbt.tgz -C ${sbtDir} --strip-components=1
    """
}

tasks.register('runSbtAssembly', Exec) {
    description = 'Runs sbt clean assembly to build the fat-jar'
    dependsOn 'installSbt'
    workingDir projectDir
    commandLine sbtScript, 'clean', 'assembly'
}

tasks.register('copySbtAssemblyJar', Copy) {
    description = 'Copies the sbt assembly jar into build/libs'
    dependsOn 'runSbtAssembly'

    from("$projectDir/target/scala-${scalaBinaryVersion}") {
        include '*assembly*.jar'
        rename { String fileName ->
            "epm-tool-assembly-${version}.jar"
        }
    }
    into("$buildDir/libs")
}

tasks.register('assembleFatJar') {
    group       = 'build'
    description = 'assemble fat-jar via sbt and copy it to build/libs'
    dependsOn 'copySbtAssemblyJar'
}

// Define a dummy bootJar task to satisfy external pipelines
tasks.register('bootJar') {
    group = 'build'
    description = 'Dummy bootJar task to satisfy CI pipeline expectations'
    doLast {
        println "Skipping bootJar — not a Spring Boot project."
    }
}


tasks.register('integrationTest') {
    group = 'build'
    description = 'Dummy integrationTest task to satisfy CI pipeline expectations'
    doLast {
        println "Skipping integrationTest."
    }
}
tasks.named('build') {
    dependsOn("assembleFatJar")
}
tasks.named('assemble') {
    dependsOn 'assembleFatJar'
}
tasks.named('bootJar') {
    dependsOn 'assembleFatJar'
}
