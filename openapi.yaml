      properties:
        SK_SUPPLIER_NUMBER:
          description: Autoincrementing integer primary key
          type: string
        SUPPLIER_UNIQUE_NUMBER:
          description: This id uniquely identifies the supplier in the table and across
            systems. VLC ID, if no VLC, then the CAAPS vendor ID, if the origin of
            the supplier record is buy@ibm - and no VLC for the supplier - then SM
            vendor ID
          type: string
        VENDOR_LEAD_CLIENT_NUMBER:
          description: Suppliers 10 digit VLC number, this might be the same as Supplier
            Number if the supplier does not have legacy supplier ID or can be blank
            if the supplier does not have VLC ID.
          type: string
        SUPPLIER_MANAGEMENT_NUMBER:
          description: Supplier Management ID that uniquely identifies the supplier
            in Ariba.
          type: string
        SUPPLIER_ERP_NUMBER:
          description: Supplier number used in Ariba ERP module
          type: string
        SUPPLIER_ARIBA_NETWORK_NUMBER:
          description: Supplier Ariba Network ID that uniquely identifies the supplier
            in Ariba Network
          type: string
        SUPPLIER_ARIBA_CONTRACT_MANAGEMENT_NUMBER:
          description: Supplier Contract Management ID that uniquely identifies the
            supplier in the Ariba Contract Management module.
          type: string
        SUPPLIER_NUMBER:
          description: uniquely identifies suppliers for SAP systems, called VLC,
            Vendor Lead Client,10 digits long, begins with 10, for other source system
            this might not be unique, for those to be used with country+company code
            to uniquely identify. Also known as Legacy ID
          type: string
        SUPPLIER_NAME1:
          description: Name the supplier has been registered with in IBM supplier
            onboarding systems
          type: string
        SUPPLIER_NAME2:
          description: Additional field for longer supplier names
          type: string
        SUPPLIER_NAME3:
          description: Additional field for longer supplier names
          type: string
        SUPPLIER_NAME4:
          description: Additional field for longer supplier names
          type: string
        SUPPLIER_ADDRESS_STREET:
          description: Street name from the supplier address
          type: string
        SUPPLIER_ADDRESS_REGION_CODE:
          description: Region code from the supplier address
          type: string
        SUPPLIER_ADDRESS_DISTRICT_NAME:
          description: District name from the supplier address
          type: string
        SUPPLIER_ADDRESS_CITY:
          description: City name from the supplier address
          type: string
        SUPPLIER_ADDRESS_COUNTRY_CODE:
          description: Two character country ISO code from the supplier address
          type: string
        SUPPLIER_ADDRESS_ZIP_CODE:
          description: ZIP code from the supplier address
          type: string
        SUPPLIER_VAT_REGISTRATION_NUMBER:
          description: VAT registration number the supplier provided
          type: string
        SUPPLIER_CENTRAL_POSTING_BLOCK_CODE:
          description: 'Supplier posting block is Y if no invoices can be posted,
            booked for the supplier regardless the country, company, flag is set centrally
            and is applicable to all lower levels in the company hierarchy. Value
            is N if invoices can booked, posted. '
          type: string
        SUPPLIER_CENTRAL_PURCHASING_BLOCK_CODE:
          description: Supplier purchasing block is Y if no purchase orders can be
            created for the supplier regardless the country, company, purchasing organization,Flag
            is N if purchase orders can be created for the supplier
          type: string
        SUPPLIER_SEGMENTATION_CODE:
          description: Sunset process for supplier classification
          type: string
        SUPPLIER_RECORD_CREATION_DATE:
          description: 'Create date for the supplier record.  If unavailabe then it
            is set to 2222-02-22. Source system logic: If LFA1-ERDATE = blank or 00000000,
            then use past date 1900-06-04.  Format = yyyy-mm-dd'
          type: string
          format: date-time
        SUPPLIER_DELETE_FLAG:
          description: 'Central deletion flag is set to Y if the supplier cannot be
            used for any activity. Source system logic: LFA1-LOEVM where if value
            = X then populate with Y, else N'
          type: string
        SUPPLIER_RECORD_SOURCE_SYSTEM:
          description: Representing where the supplier master record is originating
            from. Typically it is SAPGP0100, however, there are some legacy systems
            not integrated into the general supplier master data management process.
          type: string
        SUPPLIER_MASTER_DATA_EXTRACT_TIME:
          description: Date and time when the record was extracted from BDW to SM2K.
          type: string
          format: date-time
        SUPPLIER_DUNNS_ENTITY_NUMBER:
          description: Dun and Bradstreet identifier for the Supplier legal entity
          type: string
        SUPPLIER_DUNNS_BRANCH_NUMBER:
          description: Dun and Bradstreet identifier for the Supplier legal entitys
            branch
          type: string
        SUPPLIER_DUNNS_DOMESTIC_NUMBER:
          description: Dun and Bradstreet identifier for the Supplier legal entitys
            domestic ultimate
          type: string
        SUPPLIER_DUNNS_GLOBAL_NUMBER:
          description: Dun and Bradstreet identifier for the Supplier legal entitys
            global ultimate
          type: string
        SUPPLIER_CONTACT_NAME:
          description: Employee name at the supplier side who is the main contact
          type: string
        SUPPLIER_CONTACT_PHONE:
          description: Main Contacts phone number
          type: string
        SUPPLIER_CONTACT_EMAIL:
          description: Main contacts email address
          type: string
        SUPPLIER_MASTER_RECORD_CREATION_DATE:
          description: The first time the suppler record was created in the supplier
            master
          type: string
          format: date-time
        SUPPLIER_ADDRESS_VERIFICATION_DATE:
          description: last time the supplier address was verified
          type: string
          format: date-time
        SUPPLIER_PO_BOX:
          description: Supplier PO Box if any
          type: string
        SUPPLIER_PO_BOX_ZIP_CODE:
          description: Supplier Zip code belonging to the PO box
          type: string
        SUPPLIER_IBM_AFFILIATE_FLAG:
          description: Showing is the supplier is owned by IBM
          type: string
        SUPPLIER_IN_USE_FLAG:
          description: Showing if the supplier entity has PO, Invoice, Contract, soursing
            event activity
          type: string
        SUPPLIER_SOLE_PROPRIETOR_FLAG:
          description: Natural Person Flag from MDG
          type: string
        SUPPLIER_SUBCONTRACTOR_FLAG:
          description: Subcontractor flag from SAP Standard Industry System = 01
          type: string
        SHARED_SUPPLIER_FLAG:
          description: Flag to indicate suppliers that work with Redhat and IBM as
            well.
          type: string
        SK_SUPPLIER_MASTER_RECORD_CREATION_DATE:
          description: The first time the suppler record was created in the supplier
            master
          type: integer
          format: int32
        SK_SUPPLIER_ADDRESS_VERIFICATION_DATE:
          description: last time the supplier address was verified
          type: integer
          format: int32
        SK_SUPPLIER_BANK:
          description: Connection to the future Enterprise bank dimension
          type: integer
          format: int32
        SK_SUPPLIER_ADDRESS_COUNTRY_CODE:
          description: SK To GEO dim via 2-digi ISO country code
          type: integer
          format: int32
        SK_SUPPLIER_RECORD_CREATION_DATE:
          description: sk to Create date for the supplier record.  If unavailabe then
            it is set to 2222-02-22.
          type: integer
          format: int32
        SK_SUPPLIER_RECORD_SOURCE_SYSTEM:
          description: sk to Representing where the supplier master record is originating
            from. Typically it is SAPGP0100, however, there are some legacy systems
            not integrated into the general supplier master data management process.
          type: integer
          format: int32
        SK_SUPPLIER_MANAGEMENT_NUMBER:
          description: sk to Supplier Management ID that uniquely identifies the supplier
