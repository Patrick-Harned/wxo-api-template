        description: DUNS global ultimate number for the supplier
        required: false
        schema:
          type: string
      - name: SUPPLIER_NAME1
        in: query
        description: 'Supplier name. You must use an exact match. If the user provides
          a supplier name, you should first search the DIM_S2P_SUPPLIER table which
          supports fuzzy match to determine the correct name before attempting a search
          here. '
        required: false
        schema:
          type: string
      - name: NUMBER_OF_PURCHASE_ORDERS
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: YEAR
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: MONTH
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: START_DATE
        in: query
        description: ISO 8601 extended date format to indicate the start date
        required: false
        schema:
          type: string
      - name: END_DATE
        in: query
        description: ISO 8601 extended date format to indicate the end date
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limits the result set to N records. Defaults to 10. Use this
          combined with offset to paginate results.
        required: false
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: Offsets the result set by N records. Defaults to 0. Use this
          combined with limit to paginate results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrderCount_PersistedField'
        '400':
          description: 'Invalid value for: query parameter SK_SUPPLIER_NUMBER, Invalid
            value for: query parameter NUMBER_OF_PURCHASE_ORDERS, Invalid value for:
            query parameter YEAR, Invalid value for: query parameter MONTH, Invalid
            value for: query parameter limit, Invalid value for: query parameter offset'
          content:
            text/plain:
              schema:
                type: string
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - httpAuth: []
      - apiKeyAuth: []
